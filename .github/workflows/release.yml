name: release

# Managed by maelys-release v0.54.0 (0.54.0). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@7a42a7899f1b6f73347efcc02bd4c60941c18087 # v0.54.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-cli
      tag: ${{ inputs.tag || github.ref_name }}
      dependency_checkout: |
        sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"

  tap-libmaelys-cli:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@7a42a7899f1b6f73347efcc02bd4c60941c18087 # v0.54.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-cli
      tag: ${{ inputs.tag || github.ref_name }}
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}

  tap-maelys:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@7a42a7899f1b6f73347efcc02bd4c60941c18087 # v0.54.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys
      tag: ${{ inputs.tag || github.ref_name }}
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
