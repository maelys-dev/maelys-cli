name: ci

# The `check` job is the socle's reusable CI (maelys-release
# check-product.yml at the version release.yml pins): pinned dependency
# checkouts, packages of dependencies/packages, `make check` on the three release
# targets, sanitizers on Linux x86_64 and the socle drift check. The jobs
# below it are this product's own.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@421fa11587ed69f93c252275f7fff64e45b8e8c1 # v0.57.1
    with:
      product: maelys-cli
      check_command: make check
      sanitizer_command: make asan-ubsan

  packaging:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Pinned dependency checkouts
        run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >> "$GITHUB_ENV"
      - name: Install check
        run: make install-check
      - name: CMake package
        run: make cmake-check
      - name: Static analysis
        if: runner.os == 'macOS'
        run: make analyze

  # The Python framework declares Python 3.9 or later; its tests run on the
  # oldest supported interpreter here, the newest in the check job. This job
  # stays on Ubuntu 24.04: setup-python has no 3.9 build for 26.04.
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - name: Python framework tests on 3.9
        run: make python-check python-doc-check

  gcc:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Pinned dependency checkouts
        run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >> "$GITHUB_ENV"
      - name: Build with GCC
        run: make check CC=gcc CXX=g++

  # The single context main's ruleset requires. Every other job here is named
  # after a runner or the socle's matrix, so a socle bump or a runner rename
  # turns a required context into one that never reports and blocks the branch
  # with nothing to lift it. This name depends on neither, and the rule reads
  # one status instead of nine.
  ci:
    needs: [check, packaging, python, gcc]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Refuse unless every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          if printf '%s' "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null; then
            echo "every job succeeded"
          else
            printf '%s' "$RESULTS" \
              | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' >&2
            exit 1
          fi
