name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: maelys-cli
      - uses: actions/checkout@v4
        with:
          repository: maelys-dev/maelys-json
          ref: v0.1.0
          path: maelys-json
      - name: Build and check
        working-directory: maelys-cli
        run: make check
      - name: Sanitizers
        working-directory: maelys-cli
        run: make asan-ubsan
      - name: Static analysis
        if: runner.os == 'macOS'
        working-directory: maelys-cli
        run: make analyze
      - name: Install check
        working-directory: maelys-cli
        run: make install-check
      - name: Contract drift
        working-directory: maelys-cli
        run: make contract-check
      - name: CMake package
        working-directory: maelys-cli
        run: make cmake-check
      - name: Release socle drift
        if: matrix.os == 'ubuntu-24.04'
        working-directory: maelys-cli
        run: |
          set -euo pipefail
          sha="$(sed -n 's|.*maelys-release/.github/workflows/release.yml@\([0-9a-f]\{40\}\).*|\1|p' .github/workflows/release.yml)"
          test -n "$sha"
          git clone -q https://github.com/maelys-dev/maelys-release.git "$RUNNER_TEMP/maelys-release"
          git -C "$RUNNER_TEMP/maelys-release" checkout -q "$sha"
          "$RUNNER_TEMP/maelys-release/bin/maelys-release" check .
  gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: maelys-cli
      - uses: actions/checkout@v4
        with:
          repository: maelys-dev/maelys-json
          ref: v0.1.0
          path: maelys-json
      - name: Build with GCC
        working-directory: maelys-cli
        run: make check CC=gcc CXX=g++
