name: ci

# The `check` job is the socle's reusable CI (maelys-release
# check-product.yml at the version release.yml pins): pinned dependency
# checkouts, packages of adapter/PACKAGES, `make check` on the three release
# targets, sanitizers on Linux x86_64 and the socle drift check. The jobs
# below it are this product's own.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@316f6a6cdacf1f3b3ed63e6b48412ab1e8f589e1 # v0.10.0
    with:
      product: maelys-cli
      dependency_checkout: |
        sh scripts/checkout-dependency.sh maelys-json
        sh scripts/checkout-dependency.sh agent-cli-spec
      check_command: make check
      sanitizer_command: make asan-ubsan

  packaging:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Pinned dependency checkouts
        run: sh scripts/checkout-dependency.sh maelys-json && sh scripts/checkout-dependency.sh agent-cli-spec
      - name: Install check
        run: make install-check
      - name: CMake package
        run: make cmake-check
      - name: Static analysis
        if: runner.os == 'macOS'
        run: make analyze

  # The Python framework declares Python 3.9 or later; its tests run on the
  # oldest supported interpreter here, the newest in the check job.
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - name: Python framework tests on 3.9
        run: make python-check python-doc-check

  gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Pinned dependency checkouts
        run: sh scripts/checkout-dependency.sh maelys-json && sh scripts/checkout-dependency.sh agent-cli-spec
      - name: Build with GCC
        run: make check CC=gcc CXX=g++
