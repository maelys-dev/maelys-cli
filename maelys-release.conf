# What this product publishes, read by maelys-release (docs/conventions.md).
# The socle renders it into release.yml; nothing here is a workflow. Targets,
# archive kinds and channels keep the socle's defaults: a static library and
# its dispatcher on the three native targets, no registry.

# This repository publishes without an approval step, and says so rather than
# leaving the socle to report the gap at every preflight. What guards a
# publication here is upstream of the environment: a signed annotated tag on
# main, which only the signing key can create, on a commit whose checks
# `maelys-release cut` verified twice — once on the release commit, once on
# the merge commit it tags. The conventions note that an approver who may
# approve their own deployment is a pause rather than a control; this
# declaration is the honest name for what the environment actually holds, not
# a way to quiet the note. Arming a reviewer later is one `gh api` call and a
# change of this line to `reviewer`.
[gate]
none

# The version is materialised twice: VERSION, and the MAELYS_CLI_VERSION*
# macros of include/maelys/cli/version.h that consumers compile against.
# `make check-version` fails when they drift; cut runs this command between
# writing VERSION and the bump commit, so the header joins that commit and
# the checks of that commit can be green.
[cut]
after-version sh tools/sync-version.sh

# The pinned dependencies live under one root the socle gives, never beside
# this repository: `maelys-release dependencies . --apply` materialises them
# on a machine and prints MAELYS_DEPENDENCIES_DIR, and the managed
# scripts/checkout-dependencies.sh does the same in a job. A build with no
# root fails on its own message instead of reading whatever sits beside the
# repository, so a machine and CI read the same root and fail or pass
# together. One dependency at a time still overrides through its own
# MAELYS_JSON_DIR or AGENT_CLI_SPEC_DIR.
[dependencies]
apart
