# What this product publishes, read by maelys-release (docs/conventions.md).
# The socle renders it into release.yml; nothing here is a workflow. Targets,
# archive kinds, channels and gate keep the socle's defaults: a static library
# and its dispatcher on the three native targets, no registry.

# The version is materialised twice: VERSION, and the MAELYS_CLI_VERSION*
# macros of include/maelys/cli/version.h that consumers compile against.
# `make check-version` fails when they drift; cut runs this command between
# writing VERSION and the bump commit, so the header joins that commit and
# the checks of that commit can be green.
[cut]
after-version sh tools/sync-version.sh
